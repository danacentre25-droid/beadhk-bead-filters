<script>
(function () {
  'use strict';

  /* ===== CSS Injection (inside script so BigCommerce Script Manager validates) ===== */
  var CSS = [
    ".bhk-pb{--navy:#213A73;--navy-d:#16264D;--navy-t:#EAF0FA;--gold:#D6A650;--gold-d:#8A6420;--line:#E2E7F1;--muted:#5A6378;font-family:'Plus Jakarta Sans','Helvetica Neue',Arial,sans-serif;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:24px 0}",
    ".bhk-pb *{box-sizing:border-box}",
    ".bhk-pb__title{font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold-d);margin:0 0 12px}",
    ".bhk-pb__grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}",
    ".bhk-pb__btn{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 14px;border-radius:12px;border:1.5px solid #C9D2E4;background:#fff;color:var(--navy-d);text-decoration:none;line-height:1.2}",
    ".bhk-pb__btn:hover{border-color:var(--navy);background:var(--navy-t)}",
    ".bhk-pb__btn--back{background:var(--navy);border-color:var(--navy);color:#fff}",
    ".bhk-pb__btn--back:hover{background:var(--navy-d);border-color:var(--navy-d)}",
    ".bhk-pb__ic{width:30px;height:30px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--navy-t);color:var(--navy)}",
    ".bhk-pb__btn--back .bhk-pb__ic{background:rgba(255,255,255,.15);color:#fff}",
    ".bhk-pb__txt{display:flex;flex-direction:column;min-width:0}",
    ".bhk-pb__k{font-size:12px;font-weight:700;color:var(--muted)}",
    ".bhk-pb__btn--back .bhk-pb__k{color:#C9D3EA}",
    ".bhk-pb__v{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}",
    "@media (max-width:1100px){.bhk-pb__grid{grid-template-columns:repeat(3,minmax(0,1fr))}}",
    "@media (max-width:600px){.bhk-pb{padding:14px}.bhk-pb__grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bhk-pb__btn--back{grid-column:1 / -1}.bhk-pb__btn{padding:10px 12px;gap:8px}.bhk-pb__btn:not(.bhk-pb__btn--back) .bhk-pb__ic{display:none}.bhk-pb__v{white-space:normal}}"
  ].join("\n");

  if (!document.getElementById('bhk-pb-style')) {
    var styleEl = document.createElement('style');
    styleEl.id = 'bhk-pb-style';
    styleEl.appendChild(document.createTextNode(CSS));
    (document.head || document.documentElement).appendChild(styleEl);
  }

  /* ===== Settings — change these ===== */
  var CONFIG = {
    DATA_URL: 'https://danacentre25-droid.github.io/beadhk-bead-filters/', // same address as the Refine bar
    PRODUCT_ID: 'input[name="product_id"]',   // hidden field with the product id on product pages
    PLACE_BEFORE: ['.productView-description', '#tab-related', '.productView-reviews'], // first one found = buttons go above it
    PLACE_AFTER: '.productView',               // used when none of the above is found
    TITLE: 'Find more like this',
    TEST_ONLY: true                            // true = shows only with ?rftest=1 in the address
  };

  // Row format: [id, name, url, image, price, size, shape, color, treatment, material]
  // Buttons 2-6. For "Find Natural" the button searches Natural (or 100% Natural).
  var FINDS = [
    { key: 'color', label: 'Find Color', col: 7 },
    { key: 'shape', label: 'Find Shape', col: 6 },
    { key: 'size', label: 'Find Size', col: 5 },
    { key: 'gemstone', label: 'Find Natural', value: 'Natural' },
    { key: 'material', label: 'Find Material', col: 9 }
  ];
  var SWATCH = {
    Red: '#B3322C', Pink: '#E3A6AE', Orange: '#D9772B', Yellow: '#E2BE3E', Green: '#4E8A5E', Blue: '#2F5DA8',
    Purple: '#7B5EA7', Brown: '#8A5A2B', Black: '#222222', White: '#F4F2EC', Grey: '#9AA0A6', Clear: '#FFFFFF',
    Turquoise: '#3BB4B4', Amethyst: '#926AA6', Crystal: '#E8F1F5',
    Multicolor: 'conic-gradient(#B3322C,#E2BE3E,#4E8A5E,#2F5DA8,#7B5EA7,#B3322C)',
    'Multi Color': 'conic-gradient(#B3322C,#E2BE3E,#4E8A5E,#2F5DA8,#7B5EA7,#B3322C)',
    Mix: 'conic-gradient(#B3322C,#E2BE3E,#4E8A5E,#2F5DA8,#7B5EA7,#B3322C)'
  };
  var ICON_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  var ICON_FIND = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function getJSON(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error(r.status + ' ' + url);
      return r.json();
    });
  }
  function lastList() {
    try { return JSON.parse(sessionStorage.getItem('bhkList') || 'null'); } catch (e) { return null; }
  }
  function addTest(url) {
    if (!/[?&]rftest=1/.test(location.search) || /[?&]rftest=1/.test(url)) return url;
    return url + (url.indexOf('?') < 0 ? '?' : '&') + 'rftest=1';
  }
  function button(href, cls, icon, k, v) {
    return '<a class="bhk-pb__btn' + cls + '" href="' + esc(addTest(href)) + '">' +
      '<span class="bhk-pb__ic">' + icon + '</span><span class="bhk-pb__txt"><span class="bhk-pb__k">' + esc(k) +
      '</span><span class="bhk-pb__v">' + esc(v) + '</span></span></a>';
  }
  function place(box) {
    for (var i = 0; i < CONFIG.PLACE_BEFORE.length; i++) {
      var el = document.querySelector(CONFIG.PLACE_BEFORE[i]);
      if (el) { el.parentNode.insertBefore(box, el); return true; }
    }
    var after = document.querySelector(CONFIG.PLACE_AFTER);
    if (after) { after.parentNode.insertBefore(box, after.nextSibling); return true; }
    return false;
  }

  function start() {
    if (CONFIG.TEST_ONLY && !/[?&]rftest=1/.test(location.search)) return;
    var idEl = document.querySelector(CONFIG.PRODUCT_ID);
    if (!idEl || !Number(idEl.value)) return; // not a product page
    var pid = Number(idEl.value);

    Promise.all([
      getJSON(CONFIG.DATA_URL + 'index.json'),
      getJSON(CONFIG.DATA_URL + 'p/' + Math.floor(pid / 1000) + '.json')
    ]).then(function (res) {
      var paths = {};
      Object.keys(res[0].c).forEach(function (p) { paths[res[0].c[p]] = (res[0].u && res[0].u[res[0].c[p]]) || p; });
      var cats = res[1][pid];
      if (!cats) return;
      return getJSON(CONFIG.DATA_URL + 'c/' + cats[0] + '.json').then(function (rows) {
        var me = rows.filter(function (r) { return r[0] === pid; })[0];
        if (!me) return;

        // 1) Back to Results: the filtered list the buyer came from, otherwise the product's overview page
        var list = lastList();
        var backHref = (list && list.path && list.path !== location.pathname) ? list.path + (list.search || '') : paths[cats[0]];
        var backLabel = (list && list.path && list.path !== location.pathname && list.label) ? list.label : 'Overview';

        // 2-6) Find buttons open the list page filtered by one value
        var listPath = paths[cats[1]] || paths[cats[0]];
        var html = '';
        if (backHref) html += button(backHref, ' bhk-pb__btn--back', ICON_BACK, 'Back to Results', backLabel);
        FINDS.forEach(function (f) {
          var v = f.value || me[f.col];
          if (f.key === 'gemstone' && me[8] === '100% Natural') v = '100% Natural';
          if (!v || !listPath) return;
          var icon = f.key === 'color' && SWATCH[v] ?
            '<span style="width:18px;height:18px;border-radius:9px;background:' + SWATCH[v] + ';box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)"></span>' : ICON_FIND;
          html += button(listPath + '?' + f.key + '=' + encodeURIComponent(v), '', icon, f.label, v);
        });
        if (!html) return;

        var box = document.createElement('section');
        box.className = 'bhk-pb';
        box.setAttribute('aria-label', CONFIG.TITLE);
        box.innerHTML = '<h2 class="bhk-pb__title">' + esc(CONFIG.TITLE) + '</h2><div class="bhk-pb__grid">' + html + '</div>';
        place(box);
      });
    }).catch(function (err) {
      if (window.console) console.warn('Product buttons not loaded:', err);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
