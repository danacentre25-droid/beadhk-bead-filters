      l.sort(function (a, b) {
        var rankA = originalOrderMap[a[0]] !== undefined ? originalOrderMap[a[0]] : 999999;
        var rankB = originalOrderMap[b[0]] !== undefined ? originalOrderMap[b[0]] : 999999;
        return rankA - rankB;
      });
    }
    return l;
  }
  function selectedCount() {
    return GROUPS.reduce(function (n, g) { return n + state[g.key].length; }, 0);
  }

  /* ----- Rendering Side Filters ----- */
  function renderSide() {
    var html = '<div class="bhk-rf__head"><span class="bhk-rf__title">' + ICON_FILTER + 'Refine</span>' +
      '<span style="display:flex;gap:4px;align-items:center">' +
      (selectedCount() ? '<button type="button" class="bhk-rf__clear" data-act="clear">Clear all</button>' : '') +
      '<button type="button" class="bhk-rf__close" data-act="close" aria-label="Close filters">' + ICON_X + '</button></span></div>';

    GROUPS.forEach(function (g) {
      var counts = {};
      items.forEach(function (p) {
        var v = p[g.col];
        if (!v) return;
        if (!(v in counts)) counts[v] = 0;
        if (match(p, g.key)) counts[v]++;
      });
      var values = sortValues(g, Object.keys(counts), counts).filter(function (v) {
        return counts[v] > 0 || state[g.key].indexOf(v) >= 0;
      });
      if (!values.length) return;
      var isClosed = closed[g.key] !== undefined ? closed[g.key] : (!g.open && !state[g.key].length);
      var limit = (g.type !== 'pill' && !expanded[g.key]) ? MAX_VISIBLE : 999;
      html += '<div class="bhk-g' + (isClosed ? ' is-closed' : '') + '">' +
        '<button type="button" class="bhk-g__btn" data-act="toggle" data-g="' + g.key + '" aria-expanded="' + !isClosed + '">' +
        esc(g.label) + (state[g.key].length ? ' (' + state[g.key].length + ')' : '') + ICON_CHEV + '</button><div class="bhk-g__body">';
      if (g.type === 'pill') html += '<div class="bhk-pills">';
      values.slice(0, limit).forEach(function (v) {
        var on = state[g.key].indexOf(v) >= 0;
        var attrs = ' data-act="pick" data-g="' + g.key + '" data-v="' + esc(v) + '"' +
          (g.type === 'pill' ? ' aria-pressed="' + on + '"' : ' role="checkbox" aria-checked="' + on + '"');
        if (g.type === 'pill') {
          html += '<button type="button" class="bhk-pill"' + attrs + '>' + esc(v) + '</button>';
        } else if (g.type === 'swatch') {
          html += '<button type="button" class="bhk-opt"' + attrs + '>' +
            '<span class="bhk-cb" aria-hidden="true">' + ICON_CHECK + '</span>' +
            '<span class="bhk-sw" style="background:' + (SWATCH[v] || '#ccc') + '"></span>' +
            esc(v) + '<span class="bhk-opt__n">' + counts[v] + '</span></button>';
        } else {
          html += '<button type="button" class="bhk-opt"' + attrs + '>' +
            '<span class="bhk-cb" aria-hidden="true">' + ICON_CHECK + '</span>' + esc(v) +
            '<span class="bhk-opt__n">' + counts[v] + '</span></button>';
        }
      });
      if (g.type === 'pill') html += '</div>';
      if (values.length > limit) html += '<button type="button" class="bhk-more" data-act="more" data-g="' + g.key + '">Show ' + (values.length - limit) + ' more</button>';
      html += '</div></div>';
    });
    return html;
  }

  /* ----- Rendering Card Design Matching bhk-card.html ----- */
  function formatPriceCell(val, defaultVal) {
    var v = val ? String(val).trim() : '';
    if (!v && defaultVal) v = 'US$' + Number(defaultVal).toFixed(2);
    if (!v) return '-';
    if (/^[0-9.]+$/.test(v)) return 'US$' + Number(v).toFixed(2);
    return v;
  }

  function card(p) {
    var href = /[?&]rftest=1/.test(location.search) ? p[2] + (p[2].indexOf('?') < 0 ? '?' : '&') + 'rftest=1' : p[2];
    var minQty = p[13] || (/bracelet/i.test(p[1]) ? 30 : 1);
    var priceA = formatPriceCell(p[10], p[4]);
    var priceB = formatPriceCell(p[11], p[4] ? p[4] * 0.93 : null);
    var priceC = formatPriceCell(p[12], p[4] ? p[4] * 0.80 : null);

    return '<article class="bcard" data-entity-id="' + p[0] + '">' +
      '<figure class="bcard-figure">' +
      '<a href="' + esc(href) + '" class="bcard-figure__link">' +
      '<div class="bcard-imgWrap">' + (p[3] ? '<img class="bcard-image" src="' + esc(p[3]) + '" alt="' + esc(p[1]) + '" loading="lazy">' : '') + '</div>' +
      '</a>' +
      '<a class="bcard-btn quickview" data-product-id="' + p[0] + '" data-event-type="product-click" href="javascript:void(0)">Quick view</a>' +
      '</figure>' +
      '<div class="bcard-body">' +
      '<h4 class="bcard-title"><a href="' + esc(href) + '">' + esc(p[1]) + '</a></h4>' +
      '<table class="bcard-priceTable" data-test-info-type="price">' +
      '<thead><tr><th>Order Total</th><th>Price</th></tr></thead>' +
      '<tbody>' +
      '<tr><td class="qv-table-amount notranslate" translate="no">US$2,500+</td><td class="bcard-priceValue qv-price-a notranslate" translate="no">' + esc(priceA) + '</td></tr>' +
      '<tr><td class="qv-table-amount notranslate" translate="no">US$5,000+</td><td class="bcard-priceValue qv-price-b notranslate" translate="no">' + esc(priceB) + '</td></tr>' +
      '<tr><td class="qv-table-amount notranslate" translate="no">US$20,000+</td><td class="bcard-priceValue qv-price-c notranslate" translate="no">' + esc(priceC) + '</td></tr>' +
      '</tbody></table>' +
      '<div class="bcard-qtyCart">' +
      '<span class="bcard-qty__label">Quantity:</span>' +
      '<div class="bcard-stepper" data-card-stepper>' +
      '<button type="button" class="bcard-stepper__btn" data-step="down" aria-label="Decrease quantity">&minus;</button>' +
      '<input type="text" class="bcard-stepper__input" data-card-qty value="' + minQty + '" inputmode="numeric" pattern="[0-9]*" aria-label="Quantity">' +
      '<button type="button" class="bcard-stepper__btn" data-step="up" aria-label="Increase quantity">+</button>' +
      '</div>' +
      '<button type="button" class="bcard-btn bcard-btn--solid bcard-add notranslate" data-product-id="' + p[0] + '" data-wait-message="Adding..." aria-label="Add to Cart"></button>' +
      '</div></div></article>';
  }

  function render() {
    currentFilteredList = sorted(items.filter(function (p) { return match(p, null); }));
    var list = currentFilteredList;
    var chips = '';
    GROUPS.forEach(function (g) {
      state[g.key].forEach(function (v) {
        chips += '<button type="button" class="bhk-chip" data-act="pick" data-g="' + g.key + '" data-v="' + esc(v) +
          '" aria-label="Remove ' + esc(v) + '">' + esc(v) + ICON_X + '</button>';
      });
    });
    var n = selectedCount();
    try {
      var picked = [];
      GROUPS.forEach(function (g) { picked = picked.concat(state[g.key]); });
      sessionStorage.setItem('bhkList', JSON.stringify({ path: location.pathname, search: location.search, label: picked.join(', ') }));
    } catch (e) {}

    var main = '<div class="bhk-bar">' +
      '<button type="button" class="bhk-fbtn" data-act="open">' + ICON_FILTER + 'Filter' + (n ? ' (' + n + ')' : '') + '</button>' +
      '<span class="bhk-count">' + list.length + ' products</span>' + chips +
      '<label class="bhk-sort">Sort<select data-act="sort">' +
      [['default', 'Featured'], ['size', 'Size: small to large'], ['price', 'Price: low to high'], ['name', 'Name: A–Z']]
        .map(function (o) { return '<option value="' + o[0] + '"' + (sortBy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
      '</select></label></div>';
    main += list.length ? '<div class="bhk-grid">' + list.slice(0, shown).map(card).join('') + '</div>' :
      '<div class="bhk-empty">No products match these filters. <button type="button" class="bhk-rf__clear" data-act="clear">Clear all</button></div>';

    if (list.length > 0) {
      if (list.length > shown) {
        main += '<div class="bhk-sentinel" data-bhk-sentinel><span class="bhk-sentinel__loading">Loading more products...</span></div>';
      } else {
        main += '<div class="bhk-end-of-list"><span class="bhk-end-of-list__txt">You have reached the end of the list.</span><button type="button" class="bhk-back-to-top">Back to Top</button></div>';
      }
    }

    root.querySelector('.bhk-rf__side').innerHTML = renderSide() +
      '<div class="bhk-sheetfoot"><button type="button" data-act="close">Show ' + list.length + ' products</button></div>';
    root.querySelector('.bhk-rf__main').innerHTML = main;
    updateInfiniteScrollUI();
    if (typeof updateStickySidebar === 'function') {
      requestAnimationFrame(updateStickySidebar);
    }

    // Trigger currency switcher if store currency switcher is on page
    try {
      var curLink = document.querySelector('a.navUser-action--currencySelector');
      if (curLink) {
        var code = curLink.textContent.trim().toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
        if (code && typeof window.convertTo === 'function') {
          window.convertTo(code);
        }
      }
    } catch (e) {}
  }

  /* ----- Infinite Scroll ----- */
  function loadMoreProducts() {
    if (shown >= currentFilteredList.length) return;
    var nextBatch = currentFilteredList.slice(shown, shown + CONFIG.PAGE_SIZE);
    shown += CONFIG.PAGE_SIZE;
    var grid = root ? root.querySelector('.bhk-grid') : null;
    if (grid && nextBatch.length) {
      var temp = document.createElement('div');
      temp.innerHTML = nextBatch.map(card).join('');
      while (temp.firstChild) {
        grid.appendChild(temp.firstChild);
      }
    }
    updateInfiniteScrollUI();
  }

  function updateInfiniteScrollUI() {
    if (!root) return;
    var mainEl = root.querySelector('.bhk-rf__main');
    if (!mainEl) return;
    var sentinel = mainEl.querySelector('[data-bhk-sentinel]');
    var endEl = mainEl.querySelector('.bhk-end-of-list');

    if (shown >= currentFilteredList.length) {
      if (sentinel) sentinel.remove();
      if (!endEl && currentFilteredList.length > 0) {
        var endDiv = document.createElement('div');
        endDiv.className = 'bhk-end-of-list';
        endDiv.innerHTML = '<span class="bhk-end-of-list__txt">You have reached the end of the list.</span>' +
          '<button type="button" class="bhk-back-to-top">Back to Top</button>';
        mainEl.appendChild(endDiv);
      }
      if (scrollObserver) {
        scrollObserver.disconnect();
        scrollObserver = null;
      }
    } else {
      if (endEl) endEl.remove();
      if (!sentinel) {
        sentinel = document.createElement('div');
        sentinel.className = 'bhk-sentinel';
        sentinel.setAttribute('data-bhk-sentinel', '1');
        sentinel.innerHTML = '<span class="bhk-sentinel__loading">Loading more products...</span>';
        mainEl.appendChild(sentinel);
      }
      observeSentinel(sentinel);
    }
  }

  function observeSentinel(sentinel) {
    if (!sentinel) return;
    if (scrollObserver) scrollObserver.disconnect();
    if ('IntersectionObserver' in window) {
      scrollObserver = new IntersectionObserver(function (entries) {
        if (entries[0] && entries[0].isIntersecting) {
          loadMoreProducts();
        }
      }, { rootMargin: '600px 0px' });
      scrollObserver.observe(sentinel);
    } else {
      var onScroll = function () {
        var rect = sentinel.getBoundingClientRect();
        if (rect.top <= window.innerHeight + 600) {
          window.removeEventListener('scroll', onScroll);
          loadMoreProducts();
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
    }
  }

  /* ----- Quick View Handler ----- */
  function handleQuickView(btn) {
    var pid = btn.getAttribute('data-product-id');
    if (!pid) return;

    var utils = window.stencilUtils || (window.stencilBootstrap && window.stencilBootstrap.utils);
    var modal = (window.defaultModal && window.defaultModal()) || (window.basicModal && window.basicModal());
    if (utils && utils.api && utils.api.product && modal && modal.open) {
      modal.open();
      utils.api.product.getById(pid, { template: 'products/quick-view' }, function (err, res) {
        if (!err && res) modal.updateContent(res);
      });
      return;
    }

    if (window.$) {
      var $modal = window.$('#modal');
      if ($modal.length) {
        if ($modal.data('modal') && $modal.data('modal').open) {
          $modal.data('modal').open();
        } else if (typeof $modal.foundation === 'function') {
          $modal.foundation('reveal', 'open');
        }
        if (utils && utils.api && utils.api.product) {
          utils.api.product.getById(pid, { template: 'products/quick-view' }, function (err, res) {
            if (!err && res) $modal.find('.modal-content').html(res);
          });
          return;
        }
      }
    }

    var listing = document.querySelector(CONFIG.LISTING);
    if (listing) {
      var dummy = document.createElement('a');
      dummy.className = 'quickview';
      dummy.setAttribute('data-product-id', pid);
      dummy.style.display = 'none';
      listing.appendChild(dummy);
      if (window.$) window.$(dummy).trigger('click'); else dummy.click();
      setTimeout(function () { dummy.remove(); }, 500);
    }
  }

  /* ----- Cart and Stepper Actions ----- */
  function handleStepper(btn) {
    var stepper = btn.closest('[data-card-stepper]');
    var input = stepper && stepper.querySelector('[data-card-qty]');
    if (!input) return;
    var step = btn.getAttribute('data-step');
    var cur = parseInt(input.value, 10) || 1;
    if (step === 'up') input.value = cur + 1;
    else if (step === 'down' && cur > 1) input.value = cur - 1;
  }

  function handleAddToCart(btn) {
    var cardEl = btn.closest('.bcard');
    var qtyInput = cardEl && cardEl.querySelector('[data-card-qty]');
    var qty = Math.max(1, parseInt(qtyInput ? qtyInput.value : '1', 10) || 1);
    var pid = parseInt(btn.getAttribute('data-product-id'), 10);
    if (!pid) return;

    btn.disabled = true;
    btn.setAttribute('data-busy', '1');
    btn.textContent = 'Adding...';

    fetch('/api/storefront/carts', { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (carts) {
        var cartId = carts && carts.length ? carts[0].id : null;
        var url = cartId ? ('/api/storefront/carts/' + cartId + '/items') : '/api/storefront/carts';
        return fetch(url, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lineItems: [{ productId: pid, quantity: qty }] })
        });
      })
      .then(function (res) {
        if (!res.ok) throw new Error('Add to cart failed');
        btn.textContent = 'Added \u2713';
        setTimeout(function () {
          btn.removeAttribute('data-busy');
          btn.textContent = '';
          btn.disabled = false;
        }, 1200);
        if (typeof window.refreshJnsCartUI === 'function') {
          Promise.resolve(window.refreshJnsCartUI()).then(function () {
            if (typeof window.openJnsSideCart === 'function') window.openJnsSideCart();
          });
        } else if (typeof window.openJnsSideCart === 'function') {
          window.openJnsSideCart();
        }
      })
      .catch(function () {
        btn.textContent = 'Error';
        setTimeout(function () {
          btn.removeAttribute('data-busy');
          btn.textContent = '';
          btn.disabled = false;
        }, 1500);
      });
  }

  /* ----- Events ----- */
  function onClick(e) {
    var qvBtn = e.target.closest('.quickview');
    if (qvBtn && root.contains(qvBtn)) {
      e.preventDefault();
      handleQuickView(qvBtn);
      return;
    }

    var stepBtn = e.target.closest('[data-step]');
    if (stepBtn && root.contains(stepBtn)) {
      e.preventDefault();
      handleStepper(stepBtn);
      return;
    }

    var addBtn = e.target.closest('.bcard-add');
    if (addBtn && root.contains(addBtn)) {
      e.preventDefault();
      handleAddToCart(addBtn);
      return;
    }

    var topBtn = e.target.closest('.bhk-back-to-top');
    if (topBtn && root.contains(topBtn)) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }

    var el = e.target.closest('[data-act]');
    if (!el || !root.contains(el) || el.tagName === 'SELECT') return;
    var act = el.getAttribute('data-act'), g = el.getAttribute('data-g'), v = el.getAttribute('data-v');
    if (act === 'pick') {
      var sel = state[g], i = sel.indexOf(v);
      if (i >= 0) sel.splice(i, 1); else sel.push(v);
      shown = CONFIG.PAGE_SIZE; writeState(); render();
    } else if (act === 'clear') {
      GROUPS.forEach(function (x) { state[x.key] = []; });
      shown = CONFIG.PAGE_SIZE; writeState(); render();
    } else if (act === 'toggle') {
      var grp = GROUPS.filter(function (x) { return x.key === g; })[0];
      var cur = closed[g] !== undefined ? closed[g] : (!grp.open && !state[g].length);
      closed[g] = !cur; render();
    } else if (act === 'more') {
      expanded[g] = true; render();
    } else if (act === 'loadmore') {
      loadMoreProducts();
    } else if (act === 'open') {
      root.classList.add('is-open');
    } else if (act === 'close') {
      root.classList.remove('is-open');
    }
  }

  function onChange(e) {
    if (e.target.getAttribute('data-act') === 'sort') { sortBy = e.target.value; writeState(); render(); }
  }

  /* ----- Start ----- */
  function start() {
    if (CONFIG.TEST_ONLY && !/[?&]rftest=1/.test(location.search)) return;
    var listing = document.querySelector(CONFIG.LISTING);
    if (!listing) return;
    recordOriginalOrder(listing);
    var nextLink = document.querySelector('.pagination-item--next a, .pagination-next a, [data-pagination-next]');
    if (nextLink && nextLink.href) {
      fetchSubsequentPages(nextLink.href);
    }
    getJSON(CONFIG.DATA_URL + 'index.json').then(function (idx) {
      var id = idx.c[normPath(location.pathname)];
      if (!id) return;
      var landingCount = idx.l && idx.l[id];
      isLanding = !!landingCount;
      if (isLanding && !/[?&](list|size|shape|color|gemstone|material)=/.test(location.search)) {
        var link = document.createElement('a');
        link.className = 'bhk-listlink';
        link.href = location.pathname + '?list=1' + (/[?&]rftest=1/.test(location.search) ? '&rftest=1' : '');
        link.innerHTML = ICON_FILTER + 'Browse all ' + Number(landingCount).toLocaleString('en-US') + ' products with filters' + ICON_ARROW;
        listing.parentNode.insertBefore(link, listing);
        listing.style.display = 'none';
        return;
      }
      return getJSON(CONFIG.DATA_URL + 'c/' + id + '.json').then(function (rows) {
        if (!rows || rows.length < CONFIG.MIN_PRODUCTS) return;
        items = rows;
        readState();
        root = document.createElement('div');
        root.className = 'bhk-rf';
        root.innerHTML = '<aside class="bhk-rf__side" aria-label="Refine products"></aside><div class="bhk-rf__main"></div>';
        listing.parentNode.insertBefore(root, listing);
        CONFIG.HIDE.forEach(function (s) {
          document.querySelectorAll(s).forEach(function (el) { el.style.display = 'none'; });
        });
        root.addEventListener('click', onClick);
        root.addEventListener('change', onChange);
        window.addEventListener('popstate', function () { readState(); render(); });
        render();

        // JS fallback for sticky sidebar (bypasses parent overflow:hidden issues)
        var side = root.querySelector('.bhk-rf__side');
        updateStickySidebar = function () {
          if (!side || !root) return;
          if (window.innerWidth <= 900) {
            side.style.transform = '';
            side.style.maxHeight = '';
            return;
          }
          var rootRect = root.getBoundingClientRect();
          var header = document.querySelector('.header') || document.querySelector('header');
          var headerBottom = header ? header.getBoundingClientRect().bottom : 0;
          var offset = Math.max(160, headerBottom + 16);

          if (rootRect.top < offset) {
            var maxPush = Math.max(0, rootRect.height - side.offsetHeight);
            var push = Math.min(offset - rootRect.top, maxPush);
            side.style.transform = 'translateY(' + push + 'px)';
          } else {
            side.style.transform = '';
          }

          var sideRect = side.getBoundingClientRect();
          var avail = Math.max(260, window.innerHeight - sideRect.top - 20);
          side.style.maxHeight = avail + 'px';
        }

        window.addEventListener('scroll', updateStickySidebar, { passive: true });
        window.addEventListener('resize', updateStickySidebar, { passive: true });
        updateStickySidebar();
      });
    }).catch(function (err) {
      if (window.console) console.warn('Refine bar not loaded:', err);
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
